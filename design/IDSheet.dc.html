<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
*{box-sizing:border-box}
body{margin:0;background:#F4F7F3;color:#12302C;font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
a{color:#12302C}a:hover{color:#1F7A4D}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F4F7F3;display:flex;flex-direction:column}
.num{font-family:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;font-variation-settings:'opsz' 96;letter-spacing:-0.02em;font-feature-settings:'tnum' 1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6B7F7B}
.muted{color:#6B7F7B}
.paid{color:#1F7A4D}.late{color:#B4342C}
.icon{width:24px;height:24px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:transparent;color:#12302C;border:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;border:0;font-family:inherit;white-space:nowrap}
.btn-primary{background:#12302C;color:#F4F7F3}
.btn-secondary{background:#FFFFFF;color:#12302C;border:1.5px solid #D5DED3}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid #D5DED3;background:#FFFFFF;font-weight:500;font-size:14px;color:#12302C;white-space:nowrap}
.chip-on{background:#12302C;border-color:#12302C;color:#F4F7F3}
.chip .count{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;opacity:0.8}
.card{background:#FFFFFF;border:1px solid #E1E8DF;border-radius:16px}
.strip{display:flex;gap:3px}
.strip span{display:block;width:13px;height:6px;border-radius:2px;background:#DCE3DA}
.strip .p{background:#1F7A4D}.strip .l{background:#B4342C}.strip .d{background:#FFFFFF;border:1.5px solid #12302C}
.rule{height:1px;background:#E1E8DF}
.field{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:10px}
.frow>.field{flex:1;min-width:0}
.label{font-size:13px;font-weight:500;color:#4A5F5B}
.input{height:48px;border-radius:12px;border:1.5px solid #D5DED3;background:#FFFFFF;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:16px;color:#12302C}
.input .ph{color:#8A9A96}
.input.multi{min-height:72px;height:auto;align-items:flex-start;padding:12px 14px;line-height:1.4}
.avatar{width:40px;height:40px;border-radius:12px;background:#E3ECE1;color:#12302C;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.stamp{display:inline-block;border:1.5px solid #1F7A4D;color:#1F7A4D;border-radius:4px;padding:3px 6px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:0.08em;transform:rotate(-6deg);white-space:nowrap}
.stamp-late{border-color:#B4342C;color:#B4342C}
.tile{position:relative;background:#FFFFFF;border:1px solid #E1E8DF;border-radius:14px;padding:12px 12px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile-paid{background:#EAF5EE;border-color:#CDE6D6}
.tile-late{background:#FBEDEB;border-color:#EFCFCB}
.tile-now{border:2px solid #12302C}
.tile-next{opacity:0.62}
.secno{width:28px;height:28px;border-radius:8px;background:#12302C;color:#F4F7F3;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;flex:none}
.sechead{display:flex;align-items:center;gap:12px;padding:8px 0}
.sechead h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-0.01em}
.ptile{width:106px;height:106px;flex:none;border-radius:14px;border:1.5px solid #D5DED3;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6B7F7B;font-size:12px;font-weight:500;position:relative;overflow:hidden}
.ptile-has{border-style:solid;border-color:#CDE6D6;background:#E3ECE1;color:#12302C}
.stepbody>.field,.stepbody>.card,.stepbody>.input,.stepbody>div{flex:0 0 auto}
.idrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:#EAF5EE;color:#1F7A4D;font-size:12px;font-weight:600}
</style>
</helmet>
<div class="phone" style="width:390px;height:844px">

<div style="position:absolute;inset:0;background:#F4F7F3;opacity:0.5">
  <div style="padding:52px 8px 0;display:flex;align-items:center;justify-content:space-between">
    <button class="iconbtn"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div style="text-align:center"><div style="font-weight:600;font-size:16px">New application</div><div class="muted" style="font-size:12px">ऋण आवेदन पत्र</div></div>
    <div class="badge" style="background:#E3ECE1;color:#4A5F5B;height:24px;font-weight:500;margin-right:8px">Saved on phone</div>
  </div>
  <div style="padding:14px 16px 0"><div style="display:flex;gap:4px"><div style="flex:1;height:4px;border-radius:2px;background:#12302C"></div><div style="flex:1;height:4px;border-radius:2px;background:#12302C"></div><div style="flex:1;height:4px;border-radius:2px;background:#DCE3DA"></div><div style="flex:1;height:4px;border-radius:2px;background:#DCE3DA"></div><div style="flex:1;height:4px;border-radius:2px;background:#DCE3DA"></div><div style="flex:1;height:4px;border-radius:2px;background:#DCE3DA"></div></div>
  <div class="sechead" style="margin-top:12px;padding:0"><div class="secno">2</div><h2>Borrower</h2></div></div>
</div>
<div style="position:absolute;inset:0;background:rgba(18,48,44,0.42)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:24px 24px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 -12px 40px rgba(18,48,44,0.18)">
  <div style="width:40px;height:4px;border-radius:2px;background:#D5DED3;margin:0 auto"></div>
  <div>
    <div style="font-weight:600;font-size:18px;letter-spacing:-0.01em">ID proof</div>
    <div class="muted" style="font-size:13px;margin-top:2px">Ramesh Kumar · second of two</div>
  </div>
  <div class="field">
    <div class="label">Type</div>
    <div style="display:flex;gap:8px">
      <div class="chip" style="height:40px">Aadhaar</div><div class="chip chip-on" style="height:40px">PAN</div><div class="chip" style="height:40px">Voter ID</div><div class="chip" style="height:40px">DL</div>
    </div>
  </div>
  <div class="field"><div class="label">PAN number</div><div class="input" style="letter-spacing:0.04em">ABCPK 1234 F</div><div class="muted" style="font-size:12px">10 characters, fourth letter is P for a person</div></div>
  <div class="field">
    <div class="label">Photos</div>
    <div style="display:flex;gap:10px"><div class="ptile ptile-has"><div style="position:absolute;inset:0;background:linear-gradient(180deg,#E6EDE4,#D3DFD0)"></div><div style="position:absolute;inset:auto 0 0 0;padding:5px 7px;background:rgba(18,48,44,0.55);color:#F4F7F3;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Front</div><svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:30px;height:30px;position:relative;color:#4A5F5B"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="11" r="2"></circle><path d="M13 10h5M13 14h5M5.5 16c.5-1.5 1.5-2.5 3-2.5s2.5 1 3 2.5"></path></svg></div><div class="muted" style="font-size:12px;align-self:center;max-width:150px">PAN has no back side.</div></div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn" style="width:110px;background:transparent;color:#B4342C">Remove</button>
    <button class="btn btn-primary" style="flex:1">Done</button>
  </div>
</div>

</div>
</x-dc>
</body>
</html>
